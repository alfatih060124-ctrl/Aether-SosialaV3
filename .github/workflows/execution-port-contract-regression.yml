name: Execution Port Contract Regression

on:
  pull_request:
    paths:
      - 'services/api/src/execution-ports.mjs'
      - 'scripts/execution-port-contract-regression.mjs'
      - '.github/workflows/execution-port-contract-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run execution port contract regression
        run: node scripts/execution-port-contract-regression.mjs
