name: Two-Leg LIVE Execution Boundary Regression

on:
  pull_request:
    paths:
      - 'services/api/src/two-leg-live-execution-boundary.mjs'
      - 'services/api/src/two-leg-atomic-unsigned-transaction-builder.mjs'
      - 'services/api/src/two-leg-atomic-preflight.mjs'
      - 'services/api/src/two-leg-atomic-rpc-simulator.mjs'
      - 'services/api/src/two-leg-signer-boundary.mjs'
      - 'services/api/src/live-execution-gate.mjs'
      - 'scripts/regression-two-leg-live-execution-boundary.mjs'
      - 'scripts/regression-two-leg-atomic-unsigned-transaction-builder.mjs'
      - 'scripts/regression-two-leg-atomic-preflight.mjs'
      - 'scripts/regression-two-leg-atomic-rpc-simulator.mjs'
      - 'scripts/regression-two-leg-signer-boundary.mjs'
      - '.github/workflows/two-leg-live-execution-boundary-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install API dependencies
        working-directory: services/api
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Syntax check
        run: |
          node --check services/api/src/two-leg-live-execution-boundary.mjs
          node --check services/api/src/two-leg-atomic-unsigned-transaction-builder.mjs
          node --check services/api/src/two-leg-atomic-preflight.mjs
          node --check services/api/src/two-leg-atomic-rpc-simulator.mjs
          node --check services/api/src/two-leg-signer-boundary.mjs
          node --check scripts/regression-two-leg-live-execution-boundary.mjs
          node --check scripts/regression-two-leg-atomic-unsigned-transaction-builder.mjs
          node --check scripts/regression-two-leg-atomic-preflight.mjs
          node --check scripts/regression-two-leg-atomic-rpc-simulator.mjs
          node --check scripts/regression-two-leg-signer-boundary.mjs
      - name: Run regression
        run: |
          node scripts/regression-two-leg-live-execution-boundary.mjs
          node scripts/regression-two-leg-atomic-unsigned-transaction-builder.mjs
          node scripts/regression-two-leg-atomic-preflight.mjs
          node scripts/regression-two-leg-atomic-rpc-simulator.mjs
          node scripts/regression-two-leg-signer-boundary.mjs
