name: Copy Mandate Consent Integration Regression

on:
  pull_request:
    paths:
      - 'services/api/src/repositories/core.mjs'
      - 'services/api/src/copy-mandate.mjs'
      - 'migrations/019_copy_mandate_canonical_runtime.sql'
      - 'public/account-auto-strategy.js'
      - 'scripts/copy-mandate-consent-integration-regression.mjs'
      - '.github/workflows/copy-mandate-consent-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check consent surfaces
        run: |
          node --check services/api/src/repositories/core.mjs
          node --check public/account-auto-strategy.js
          node --check scripts/copy-mandate-consent-integration-regression.mjs
      - name: Run consent integration regression
        run: node scripts/copy-mandate-consent-integration-regression.mjs
