name: Member Auto Trade SHADOW Runtime Binding

on:
  pull_request:
    paths:
      - '.env.example'
      - 'docker-compose.yml'
      - 'services/api/package.json'
      - 'services/api/src/server-primary.mjs'
      - 'services/api/src/member-autotrade-shadow-runtime-binding.mjs'
      - 'services/api/src/member-autotrade-state-machine.mjs'
      - 'services/api/src/paper-arbitrage-persistence.mjs'
      - 'services/api/src/member-autotrade-real-market-runtime.mjs'
      - 'services/api/src/member-autotrade-real-market-runtime-factory.mjs'
      - 'services/api/src/member-autotrade-shadow-scheduler.mjs'
      - 'services/api/src/orca-raydium-shadow-network-fee-source.mjs'
      - 'scripts/regression-member-autotrade-shadow-runtime-binding.mjs'
      - 'scripts/regression-member-autotrade-shadow-runtime-composition.mjs'
      - '.github/workflows/member-autotrade-shadow-runtime-binding.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          node --check services/api/src/server-primary.mjs
          node --check services/api/src/member-autotrade-shadow-runtime-binding.mjs
          node --check services/api/src/member-autotrade-state-machine.mjs
          node --check services/api/src/member-autotrade-real-market-runtime.mjs
          node --check services/api/src/member-autotrade-real-market-runtime-factory.mjs
          node --check services/api/src/member-autotrade-shadow-scheduler.mjs
          node --check services/api/src/orca-raydium-shadow-network-fee-source.mjs
          node --check scripts/regression-member-autotrade-shadow-runtime-binding.mjs
          node --check scripts/regression-member-autotrade-shadow-runtime-composition.mjs
      - name: Run regression
        run: |
          node scripts/regression-member-autotrade-shadow-runtime-binding.mjs
          node scripts/regression-member-autotrade-shadow-runtime-composition.mjs
