name: Decoder Regression

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run decoder fixture gate
        run: node scripts/run-decoder-fixtures.mjs
      - name: Run FIFO accounting candidate gate
        run: node scripts/fifo-accounting-regression.mjs
      - name: Run fee equity reconciliation promoter gate
        run: node scripts/reconciliation-promoter-regression.mjs
      - name: Run Solana network fee source gate
        run: node scripts/solana-network-fee-regression.mjs
      - name: Run historical SOL USD valuation gate
        run: node scripts/historical-sol-usd-regression.mjs
