name: Step 21 Temporary Branch Sync

on:
  push:
    branches:
      - feat/step21-product-control-plane-consolidation

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified Step 21 local delta
        shell: bash
        env:
          PATCH_BLOB_SHA: 0caba7f525055b533ca57ed6f426febf6f33bc81
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${PATCH_BLOB_SHA}" \
            -o /tmp/step21.patch.gz
          test "$(git hash-object /tmp/step21.patch.gz)" = "${PATCH_BLOB_SHA}"
          gzip -dc /tmp/step21.patch.gz > /tmp/step21.patch
          git apply --check /tmp/step21.patch
          git apply /tmp/step21.patch
          rm -f .github/workflows/_step21_sync.yml
          git add -A
          git config user.name 'aether-step21-sync'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'feat(step21): consolidate admin and bind SHADOW runtime'
          git push origin HEAD:feat/step21-product-control-plane-consolidation
