name: Market Shadow Web Regression

on:
  pull_request:
    paths:
      - 'services/api/src/market-shadow-runtime.mjs'
      - 'services/api/src/member-autotrade-route.mjs'
      - 'api/market-shadow.mjs'
      - 'public/autotrade-demo.html'
      - 'scripts/market-shadow-web-regression.mjs'
      - 'Dockerfile'
      - 'vercel.json'
      - '.github/workflows/market-shadow-web-regression.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/market-shadow-web-regression.mjs
