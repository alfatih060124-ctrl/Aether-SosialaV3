name: Trader Control Plane Input Error Boundary Regression

on:
  pull_request:
    paths:
      - 'services/api/src/trader-control-plane-route.mjs'
      - 'services/api/src/trader-control-plane-runtime-sod.mjs'
      - 'services/api/src/trader-control-plane-role-auth.mjs'
      - 'scripts/trader-control-plane-input-error-boundary-regression.mjs'
      - '.github/workflows/trader-control-plane-input-error-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run trader control-plane input/error boundary regression
        run: node scripts/trader-control-plane-input-error-boundary-regression.mjs
