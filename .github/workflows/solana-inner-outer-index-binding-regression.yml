name: Solana Inner Instruction Outer Index Binding Regression

on:
  pull_request:
    paths:
      - 'services/api/src/solana-transaction-inner-instruction-evidence.mjs'
      - 'scripts/regression-solana-inner-outer-index-binding.mjs'
      - '.github/workflows/solana-inner-outer-index-binding-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check regression
        run: node --check scripts/regression-solana-inner-outer-index-binding.mjs
      - name: Run fail-closed regression
        run: node scripts/regression-solana-inner-outer-index-binding.mjs
