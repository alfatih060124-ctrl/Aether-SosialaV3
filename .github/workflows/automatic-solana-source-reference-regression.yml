name: Automatic Solana Source Reference Regression

on:
  pull_request:
    paths:
      - 'services/api/src/solana-evidence-source.mjs'
      - 'scripts/automatic-evidence-service-regression.mjs'
      - '.github/workflows/automatic-solana-source-reference-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check collector
        run: node --check services/api/src/solana-evidence-source.mjs
      - name: Syntax check regression
        run: node --check scripts/automatic-evidence-service-regression.mjs
      - name: Run fail-closed synthetic regression
        run: node scripts/automatic-evidence-service-regression.mjs
