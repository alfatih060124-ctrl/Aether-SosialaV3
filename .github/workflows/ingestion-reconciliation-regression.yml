name: Ingestion Reconciliation Regression
on:
  pull_request:
    paths:
      - 'services/ingestion-worker/src/reconciliation.mjs'
      - 'scripts/ingestion-reconciliation-regression.mjs'
      - '.github/workflows/ingestion-reconciliation-regression.yml'
  push:
    branches: [main]
    paths:
      - 'services/ingestion-worker/src/reconciliation.mjs'
      - 'scripts/ingestion-reconciliation-regression.mjs'
      - '.github/workflows/ingestion-reconciliation-regression.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: |
          node --check services/ingestion-worker/src/reconciliation.mjs
          node --check scripts/ingestion-reconciliation-regression.mjs
      - name: Deterministic ingestion reconciliation regression
        run: node scripts/ingestion-reconciliation-regression.mjs
