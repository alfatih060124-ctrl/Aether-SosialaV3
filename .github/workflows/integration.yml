name: Aether V3 Integration
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aether_test
          POSTGRES_USER: aether
          POSTGRES_PASSWORD: aether_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aether -d aether_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: services/api
        run: npm install --omit=dev
      - name: Run migrations
        working-directory: services/api
        env:
          DATABASE_URL: postgresql://aether:aether_test@localhost:5432/aether_test
        run: node --input-type=module -e "import {Pool} from 'pg'; import {runMigrations} from './src/migration-runner.mjs'; const p=new Pool({connectionString:process.env.DATABASE_URL}); await runMigrations(p, '../../migrations'); const r=await p.query(\"SELECT table_name FROM information_schema.tables WHERE table_schema='public' ORDER BY table_name\"); console.log(r.rows.map(x=>x.table_name).join('\\n')); await p.end();"
      - name: API health and wallet infrastructure smoke
        env:
          DATABASE_URL: postgresql://aether:aether_test@localhost:5432/aether_test
          EXECUTION_MODE: SHADOW
          LIVE_ENABLED: "false"
          ADMIN_API_TOKEN: integration_admin_token
        run: |
          node services/api/src/server.mjs > /tmp/aether.log 2>&1 &
          pid=$!
          trap 'kill $pid || true' EXIT
          for i in {1..20}; do curl -fsS http://127.0.0.1:8080/api/health && break || sleep 1; done
          curl --fail http://127.0.0.1:8080/api/readiness
          curl --fail http://127.0.0.1:8080/api/execution/status | grep -q '"live_enabled":false'
          curl --fail http://127.0.0.1:8080/api/autotrade/status | grep -q '"live_execution_authorized":false'
          curl --fail http://127.0.0.1:8080/api/signals/config | grep -q '"quality_first":true'
          curl --fail -H 'Authorization: Bearer integration_admin_token' http://127.0.0.1:8080/api/admin/wallets | grep -q '"TREASURY_MULTISIG"'
          curl --fail -X PUT -H 'Authorization: Bearer integration_admin_token' -H 'Content-Type: application/json' \
            --data '{"public_address":"11111111111111111111111111111111","enabled":true}' \
            http://127.0.0.1:8080/api/admin/wallets/TREASURY_MULTISIG | grep -q '"private_keys_stored":false'
          curl --fail -H 'Authorization: Bearer integration_admin_token' http://127.0.0.1:8080/api/admin/wallets/readiness | grep -q '"live_execution_authorized":false'
