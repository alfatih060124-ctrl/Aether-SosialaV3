name: Step 21 Member Auto Trade Runtime Binding Regression

on:
  pull_request:
    paths:
      - 'services/api/src/member-autotrade-shadow-scheduler.mjs'
      - 'services/api/src/member-autotrade-state-machine.mjs'
      - 'services/api/src/paper-arbitrage-persistence.mjs'
      - 'services/api/src/market-shadow-runtime.mjs'
      - 'scripts/vm-cross-venue-net-edge-probe.mjs'
      - 'services/api/src/server.mjs'
      - '.env.example'
      - 'docker-compose.yml'
      - 'scripts/step21-member-autotrade-runtime-binding-regression.mjs'
      - '.github/workflows/step21-member-autotrade-runtime-binding-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check services/api/src/member-autotrade-shadow-scheduler.mjs
      - run: node --check services/api/src/paper-arbitrage-persistence.mjs
      - run: node --check scripts/step21-member-autotrade-runtime-binding-regression.mjs
      - run: node scripts/step21-member-autotrade-runtime-binding-regression.mjs