name: Evidence Source Observation Receipt Regression

on:
  pull_request:
    paths:
      - 'services/api/src/evidence-source-observation-receipt.mjs'
      - 'scripts/evidence-source-observation-receipt-regression.mjs'
      - '.github/workflows/evidence-source-observation-receipt-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run source observation receipt regression
        run: node scripts/evidence-source-observation-receipt-regression.mjs
