name: Authenticated Auto Trade Route Boundary Regression

on:
  pull_request:
    paths:
      - 'services/api/src/autotrade-route-boundary.mjs'
      - 'services/api/src/persisted-autotrade-service.mjs'
      - 'services/api/src/copy-mandate-autotrade-adapter.mjs'
      - 'services/api/src/copy-mandate-runtime.mjs'
      - 'services/api/src/copy-mandate.mjs'
      - 'services/api/src/auto-trade-engine.mjs'
      - 'scripts/autotrade-route-boundary-regression.mjs'
      - '.github/workflows/autotrade-route-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/autotrade-route-boundary-regression.mjs
