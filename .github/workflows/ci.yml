name: Aether V3 CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install API dependencies
        working-directory: services/api
        run: npm install --omit=dev
      - name: Syntax check
        run: |
          node --check api/index.mjs
          node --check services/api/src/server.mjs
          node --check services/api/src/standby-server.mjs
          node --check services/api/src/shadow-simulator.mjs
          node --check services/api/src/migration-runner.mjs
          node --check services/api/src/service.mjs
          node --check services/api/src/signal-intelligence.mjs
          node --check services/api/src/auto-trade-engine.mjs
          node --check services/api/src/execution-boundary.mjs
          node --check services/api/src/market-intelligence.mjs
          node --check services/api/src/wallet-auth.mjs
          node --check services/api/src/trader-evidence-collector.mjs
          node --check services/api/src/solana-evidence-source.mjs
          node --check services/api/src/internal-reconciliation-evidence-source.mjs
          node --check services/api/src/automatic-evidence-service.mjs
          node --check services/api/src/reconciled-performance-service.mjs
          node --check packages/reconciliation-accounting/fifo.mjs
          node --check packages/reconciliation-accounting/promoter.mjs
          node --check packages/reconciliation-accounting/solana-network-fee.mjs
          node --check services/api/src/repositories/signal-intelligence.mjs
          node --check services/api/src/repositories/core.mjs
          node --check services/api/src/repositories/admin.mjs
          node --check services/api/src/repositories/marketplace.mjs
          node --check services/api/src/repositories/trade-events.mjs
          node --check services/api/src/repositories/execution-requests.mjs
          node --check scripts/run-signal-quality-tests.mjs
          node --check scripts/run-wallet-auth-tests.mjs
          node --check scripts/run-wallet-auth-http-tests.mjs
          node --check scripts/run-trader-copy-http-tests.mjs
          node --check scripts/admin-safety-regression.mjs
          node --check scripts/execution-uuid-regression.mjs
          node --check scripts/trader-evidence-collector-regression.mjs
          node --check scripts/solana-evidence-source-regression.mjs
          node --check scripts/internal-reconciliation-evidence-regression.mjs
          node --check scripts/automatic-evidence-service-regression.mjs
          node --check scripts/reconciled-performance-regression.mjs
          node --check scripts/reconciled-performance-contract-regression.mjs
          node --check scripts/fifo-accounting-regression.mjs
          node --check scripts/reconciliation-promoter-regression.mjs
          node --check scripts/solana-network-fee-regression.mjs
          node --check scripts/product-audit-separation-regression.mjs
          node --check scripts/execution-boundary-regression.mjs
          node --check scripts/market-intelligence-regression.mjs
          node --check scripts/market-edge-regression.mjs
          node --check scripts/admin-evidence-ui-regression.mjs
          node --check scripts/infrastructure-contract.mjs
          bash -n scripts/vm-apply-routing.sh
          bash -n scripts/vm-apply-infrastructure-topology.sh
          bash -n scripts/vm-deploy-wallet-auth.sh
          bash -n scripts/vm-deploy-trader-onboarding.sh
          bash -n scripts/vm-deploy-verification-copy-mandates.sh
          bash -n scripts/vm-deploy-execution-uuid-hardening.sh
          bash -n scripts/vm-finalize-shadow.sh
      - name: PRIMARY_VM rollout host-node independence
        run: |
          ! grep -Eq 'command -v node|for cmd in .*node' scripts/vm-deploy-execution-uuid-hardening.sh
          grep -q 'VALIDATOR_IMAGE=.*docker inspect' scripts/vm-deploy-execution-uuid-hardening.sh
          grep -q -- '--network none' scripts/vm-deploy-execution-uuid-hardening.sh
          grep -q -- '--read-only' scripts/vm-deploy-execution-uuid-hardening.sh
      - name: Infrastructure topology regression
        run: node scripts/infrastructure-contract.mjs
      - name: Admin fail-closed safety regression
        run: node scripts/admin-safety-regression.mjs
      - name: Execution UUID fail-closed regression
        run: node scripts/execution-uuid-regression.mjs
      - name: Trader evidence collector regression
        run: node scripts/trader-evidence-collector-regression.mjs
      - name: Solana RPC evidence source regression
        run: node scripts/solana-evidence-source-regression.mjs
      - name: Internal reconciliation evidence regression
        run: node scripts/internal-reconciliation-evidence-regression.mjs
      - name: Automatic evidence service regression
        run: node scripts/automatic-evidence-service-regression.mjs
      - name: Reconciled performance evidence regression
        run: node scripts/reconciled-performance-regression.mjs
      - name: Reconciled performance separation contract
        run: node scripts/reconciled-performance-contract-regression.mjs
      - name: FIFO accounting candidate regression
        run: node scripts/fifo-accounting-regression.mjs
      - name: Fee equity reconciliation promoter regression
        run: node scripts/reconciliation-promoter-regression.mjs
      - name: Solana network fee source regression
        run: node scripts/solana-network-fee-regression.mjs
      - name: Product audit separation regression
        run: node scripts/product-audit-separation-regression.mjs
      - name: Execution boundary regression
        run: node scripts/execution-boundary-regression.mjs
      - name: Market intelligence regression
        run: node scripts/market-intelligence-regression.mjs
      - name: Market edge regression
        run: node scripts/market-edge-regression.mjs
      - name: Admin automatic evidence UI regression
        run: node scripts/admin-evidence-ui-regression.mjs
      - name: Caddy ingress validation
        run: docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Signal quality regression
        run: node scripts/run-signal-quality-tests.mjs
      - name: Wallet authentication regression
        run: node scripts/run-wallet-auth-tests.mjs
      - name: Docker build
        run: docker build -t aether-social-v3:ci .
      - name: Primary API smoke start
        run: |
          docker run -d --name aether-ci -p 18080:8080 -e EXECUTION_MODE=SHADOW -e LIVE_ENABLED=false aether-social-v3:ci
          sleep 3
          curl --fail http://127.0.0.1:18080/api/health
          curl --fail http://127.0.0.1:18080/api/execution/status
          docker rm -f aether-ci
      - name: Render standby smoke start
        run: |
          docker run -d --name aether-standby-ci -p 18081:8080 aether-social-v3:ci node services/api/src/standby-server.mjs
          sleep 2
          curl --fail http://127.0.0.1:18081/api/health
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:18081/api/readiness)" = "503"
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:18081/api/executions)" = "503"
          docker rm -f aether-standby-ci
