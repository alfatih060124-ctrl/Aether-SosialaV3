name: Solana Wallet Signature Discovery Regression

on:
  pull_request:
    paths:
      - 'services/api/src/solana-wallet-signature-discovery.mjs'
      - 'scripts/regression-solana-wallet-signature-discovery.mjs'
      - '.github/workflows/solana-wallet-signature-discovery-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check services/api/src/solana-wallet-signature-discovery.mjs
      - run: node --check scripts/regression-solana-wallet-signature-discovery.mjs
      - run: node scripts/regression-solana-wallet-signature-discovery.mjs
