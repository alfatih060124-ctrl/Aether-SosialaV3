name: Solana RPC Pagination Manifest Regression

on:
  pull_request:
    paths:
      - 'services/api/src/solana-rpc-pagination-manifest.mjs'
      - 'services/api/src/solana-rpc-pagination-manifest.regression.mjs'
      - '.github/workflows/solana-rpc-pagination-manifest-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run synthetic/test-only pagination manifest regression
        run: node services/api/src/solana-rpc-pagination-manifest.regression.mjs
