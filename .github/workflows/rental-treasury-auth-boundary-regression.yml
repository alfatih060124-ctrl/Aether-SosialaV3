name: Rental Treasury Auth Boundary Regression

on:
  pull_request:
    paths:
      - 'services/api/src/member-autotrade-route.mjs'
      - 'services/api/src/member-engine-treasury.mjs'
      - 'scripts/rental-treasury-auth-boundary-regression.mjs'
      - '.github/workflows/rental-treasury-auth-boundary-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert privileged treasury mutation boundary
        run: node scripts/rental-treasury-auth-boundary-regression.mjs
