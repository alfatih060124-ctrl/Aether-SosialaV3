name: Evidence Window Coverage Regression

on:
  pull_request:
    paths:
      - 'services/api/src/evidence-window-coverage.mjs'
      - 'scripts/evidence-window-coverage-regression.mjs'
      - '.github/workflows/evidence-window-coverage-regression.yml'
  push:
    branches: [main]
    paths:
      - 'services/api/src/evidence-window-coverage.mjs'
      - 'scripts/evidence-window-coverage-regression.mjs'
      - '.github/workflows/evidence-window-coverage-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check services/api/src/evidence-window-coverage.mjs && node --check scripts/evidence-window-coverage-regression.mjs
      - name: Run regression
        run: node scripts/evidence-window-coverage-regression.mjs
