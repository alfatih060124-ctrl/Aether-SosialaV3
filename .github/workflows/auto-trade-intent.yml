name: Auto Trade Intent Regression
on:
  pull_request:
    paths:
      - 'services/api/src/auto-trade-engine.mjs'
      - 'services/api/src/auto-trade-intent.mjs'
      - 'services/api/src/execution-boundary.mjs'
      - 'scripts/auto-trade-intent-regression.mjs'
      - '.github/workflows/auto-trade-intent.yml'
  push:
    branches: [main]
    paths:
      - 'services/api/src/auto-trade-engine.mjs'
      - 'services/api/src/auto-trade-intent.mjs'
      - 'services/api/src/execution-boundary.mjs'
      - 'scripts/auto-trade-intent-regression.mjs'
      - '.github/workflows/auto-trade-intent.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: |
          node --check services/api/src/auto-trade-intent.mjs
          node --check scripts/auto-trade-intent-regression.mjs
      - name: Auto Trade intent boundary regression
        run: node scripts/auto-trade-intent-regression.mjs
