name: Raydium SDK RPC Quote Regression

on:
  pull_request:
    paths:
      - 'services/api/src/raydium-sdk-rpc-quote-pool.mjs'
      - 'services/api/src/raydium-runtime-sdk-module.mjs'
      - 'services/api/package.json'
      - 'scripts/regression-raydium-sdk-rpc-quote-pool.mjs'
      - 'scripts/regression-raydium-runtime-sdk-module.mjs'
      - '.github/workflows/raydium-sdk-rpc-quote-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install API runtime dependencies
        working-directory: services/api
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run Raydium SDK RPC quote regression
        run: node scripts/regression-raydium-sdk-rpc-quote-pool.mjs
      - name: Run Raydium runtime SDK import regression
        run: node scripts/regression-raydium-runtime-sdk-module.mjs
