name: Auto Trade Demo History DOM XSS Regression

on:
  pull_request:
    paths:
      - 'public/autotrade-demo.html'
      - 'scripts/autotrade-demo-history-dom-xss-regression.mjs'
      - '.github/workflows/autotrade-demo-history-dom-xss.yml'
  push:
    branches: [main]
    paths:
      - 'public/autotrade-demo.html'
      - 'scripts/autotrade-demo-history-dom-xss-regression.mjs'
      - '.github/workflows/autotrade-demo-history-dom-xss.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check regression
        run: node --check scripts/autotrade-demo-history-dom-xss-regression.mjs
      - name: Run Auto Trade Demo history DOM XSS regression
        run: node scripts/autotrade-demo-history-dom-xss-regression.mjs
