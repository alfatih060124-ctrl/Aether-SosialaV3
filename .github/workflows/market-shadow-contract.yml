name: Market SHADOW Contract

on:
  pull_request:
    paths:
      - 'api/**'
      - 'services/api/src/market-intelligence.mjs'
      - 'scripts/market-shadow-contract-regression.mjs'
      - '.github/workflows/market-shadow-contract.yml'
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'services/api/src/market-intelligence.mjs'
      - 'scripts/market-shadow-contract-regression.mjs'
      - '.github/workflows/market-shadow-contract.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Assert market SHADOW/fail-closed contract
        run: node scripts/market-shadow-contract-regression.mjs
