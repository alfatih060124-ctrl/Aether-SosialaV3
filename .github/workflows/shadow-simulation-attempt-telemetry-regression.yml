name: Shadow Simulation Attempt Telemetry Regression

on:
  pull_request:
    paths:
      - 'scripts/vm-real-market-shadow-probe.mjs'
      - 'scripts/regression-shadow-simulation-attempt-telemetry.mjs'
      - '.github/workflows/shadow-simulation-attempt-telemetry-regression.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/vm-real-market-shadow-probe.mjs'
      - 'scripts/regression-shadow-simulation-attempt-telemetry.mjs'
      - '.github/workflows/shadow-simulation-attempt-telemetry-regression.yml'

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node --check scripts/regression-shadow-simulation-attempt-telemetry.mjs
      - name: Run SHADOW simulation telemetry regression
        run: node scripts/regression-shadow-simulation-attempt-telemetry.mjs
