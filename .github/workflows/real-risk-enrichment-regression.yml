name: Real Risk Enrichment Regression

on:
  pull_request:
    paths:
      - 'services/api/src/solana-token-risk-source.mjs'
      - 'services/api/src/orca-raydium-shadow-risk-evidence-collector.mjs'
      - 'scripts/regression-solana-token-risk-source.mjs'
      - 'scripts/regression-orca-raydium-shadow-risk-evidence-collector.mjs'
      - '.github/workflows/real-risk-enrichment-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check services/api/src/solana-token-risk-source.mjs
      - run: node --check services/api/src/orca-raydium-shadow-risk-evidence-collector.mjs
      - run: node --check scripts/regression-solana-token-risk-source.mjs
      - run: node --check scripts/regression-orca-raydium-shadow-risk-evidence-collector.mjs
      - run: node scripts/regression-solana-token-risk-source.mjs
      - run: node scripts/regression-orca-raydium-shadow-risk-evidence-collector.mjs
