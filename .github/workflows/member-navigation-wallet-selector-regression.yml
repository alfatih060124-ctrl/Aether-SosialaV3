name: Member Navigation Wallet Selector Regression

on:
  pull_request:
    paths:
      - 'public/account-member-autotrade.js'
      - 'public/onboarding.html'
      - 'scripts/regression-member-navigation-wallet-selector.mjs'
      - '.github/workflows/member-navigation-wallet-selector-regression.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate member flow and wallet selector
        run: node scripts/regression-member-navigation-wallet-selector.mjs
