name: Dynamic Subscription Payment Regression

on:
  pull_request:
    paths:
      - 'services/api/src/dynamic-subscription.mjs'
      - 'services/api/src/solana-usdc-subscription-payment-verifier.mjs'
      - 'migrations/025_dynamic_subscription_billing.sql'
      - 'scripts/regression-dynamic-subscription-payment.mjs'
      - '.github/workflows/dynamic-subscription-payment-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          node --check services/api/src/dynamic-subscription.mjs
          node --check services/api/src/solana-usdc-subscription-payment-verifier.mjs
          node --check scripts/regression-dynamic-subscription-payment.mjs
      - name: Run regression
        run: node scripts/regression-dynamic-subscription-payment.mjs
