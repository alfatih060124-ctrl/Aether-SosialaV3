name: Landing Regression

on:
  push:
    branches: [main]
    paths:
      - 'public/index.html'
      - 'public/onboarding.html'
      - 'vercel.json'
      - 'scripts/landing-regression.mjs'
      - '.github/workflows/landing-regression.yml'
  pull_request:
    paths:
      - 'public/index.html'
      - 'public/onboarding.html'
      - 'vercel.json'
      - 'scripts/landing-regression.mjs'
      - '.github/workflows/landing-regression.yml'

permissions:
  contents: read

jobs:
  landing-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate public AETHER landing requirements
        run: node scripts/landing-regression.mjs
