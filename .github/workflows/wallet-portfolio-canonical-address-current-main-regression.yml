name: Wallet Portfolio Canonical Address Regression

on:
  pull_request:
    paths:
      - 'services/api/src/wallet-portfolio.mjs'
      - 'scripts/regression-wallet-portfolio-address-validation-current-main.mjs'
      - '.github/workflows/wallet-portfolio-canonical-address-current-main-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check scripts/regression-wallet-portfolio-address-validation-current-main.mjs
      - name: Enforce canonical 32-byte wallet validation before RPC
        run: node scripts/regression-wallet-portfolio-address-validation-current-main.mjs
