name: Copy Mandate Create Persistence Regression

on:
  pull_request:
    paths:
      - 'services/api/src/repositories/core.mjs'
      - 'services/api/src/copy-mandate.mjs'
      - 'scripts/copy-mandate-create-persistence-regression.mjs'
      - '.github/workflows/copy-mandate-create-persistence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run fail-closed persistence regression
        run: node scripts/copy-mandate-create-persistence-regression.mjs
