name: UI English Language Regression

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'web/**'
      - 'scripts/ui-english-language-regression.mjs'
      - '.github/workflows/ui-language-regression.yml'
  pull_request:
    paths:
      - 'public/**'
      - 'web/**'
      - 'scripts/ui-english-language-regression.mjs'
      - '.github/workflows/ui-language-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  english-only-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/ui-english-language-regression.mjs
