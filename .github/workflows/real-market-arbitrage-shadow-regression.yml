name: Real Market Arbitrage Shadow Regression

on:
  pull_request:
    paths:
      - 'services/api/package.json'
      - 'services/api/src/real-market-arbitrage-shadow.mjs'
      - 'services/api/src/orca-raydium-arbitrage-scanner.mjs'
      - 'services/api/src/orca-raydium-readonly-provider-adapter.mjs'
      - 'services/api/src/orca-raydium-shadow-runtime.mjs'
      - 'services/api/src/orca-raydium-shadow-qualification-runtime.mjs'
      - 'services/api/src/orca-raydium-shadow-evidence-adapter.mjs'
      - 'services/api/src/orca-raydium-shadow-risk-evidence-collector.mjs'
      - 'services/api/src/solana-pretrade-network-fee-estimator.mjs'
      - 'services/api/src/solana-pretrade-rpc-evidence-provider.mjs'
      - 'services/api/src/orca-raydium-unsigned-message-evidence-builder.mjs'
      - 'services/api/src/solana-unsigned-message-compiler.mjs'
      - 'services/api/src/orca-whirlpool-readonly-provider.mjs'
      - 'services/api/src/orca-whirlpool-rpc-quote-pool.mjs'
      - 'services/api/src/raydium-readonly-provider.mjs'
      - 'services/api/src/raydium-sdk-rpc-quote-pool.mjs'
      - 'services/api/src/raydium-runtime-sdk-module.mjs'
      - 'services/api/src/demo-autotrade-ledger.mjs'
      - 'services/api/src/signal-intelligence.mjs'
      - 'scripts/regression-real-market-arbitrage-shadow.mjs'
      - 'scripts/regression-orca-raydium-arbitrage-scanner.mjs'
      - 'scripts/regression-orca-raydium-readonly-provider-adapter.mjs'
      - 'scripts/regression-orca-raydium-shadow-runtime.mjs'
      - 'scripts/regression-orca-raydium-shadow-qualification-runtime.mjs'
      - 'scripts/regression-orca-raydium-shadow-evidence-adapter.mjs'
      - 'scripts/regression-orca-raydium-shadow-risk-evidence-collector.mjs'
      - 'scripts/regression-solana-pretrade-network-fee-estimator.mjs'
      - 'scripts/regression-solana-pretrade-rpc-evidence-provider.mjs'
      - 'scripts/regression-orca-raydium-unsigned-message-evidence-builder.mjs'
      - 'scripts/regression-solana-unsigned-message-compiler.mjs'
      - 'scripts/regression-orca-whirlpool-readonly-provider.mjs'
      - 'scripts/regression-orca-whirlpool-rpc-quote-pool.mjs'
      - '.github/workflows/real-market-arbitrage-shadow-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check services/api/src/real-market-arbitrage-shadow.mjs
      - run: node --check services/api/src/orca-raydium-arbitrage-scanner.mjs
      - run: node --check services/api/src/orca-raydium-readonly-provider-adapter.mjs
      - run: node --check services/api/src/orca-raydium-shadow-runtime.mjs
      - run: node --check services/api/src/orca-raydium-shadow-qualification-runtime.mjs
      - run: node --check services/api/src/orca-raydium-shadow-evidence-adapter.mjs
      - run: node --check services/api/src/orca-raydium-shadow-risk-evidence-collector.mjs
      - run: node --check services/api/src/solana-pretrade-network-fee-estimator.mjs
      - run: node --check services/api/src/solana-pretrade-rpc-evidence-provider.mjs
      - run: node --check services/api/src/orca-raydium-unsigned-message-evidence-builder.mjs
      - run: node --check services/api/src/solana-unsigned-message-compiler.mjs
      - run: node --check services/api/src/orca-whirlpool-readonly-provider.mjs
      - run: node --check services/api/src/orca-whirlpool-rpc-quote-pool.mjs
      - run: node --check services/api/src/raydium-readonly-provider.mjs
      - run: node --check services/api/src/raydium-sdk-rpc-quote-pool.mjs
      - run: node --check services/api/src/raydium-runtime-sdk-module.mjs
      - run: node --check services/api/src/demo-autotrade-ledger.mjs
      - run: node --check scripts/regression-real-market-arbitrage-shadow.mjs
      - run: node --check scripts/regression-orca-raydium-arbitrage-scanner.mjs
      - run: node --check scripts/regression-orca-raydium-readonly-provider-adapter.mjs
      - run: node --check scripts/regression-orca-raydium-shadow-runtime.mjs
      - run: node --check scripts/regression-orca-raydium-shadow-qualification-runtime.mjs
      - run: node --check scripts/regression-orca-raydium-shadow-evidence-adapter.mjs
      - run: node --check scripts/regression-orca-raydium-shadow-risk-evidence-collector.mjs
      - run: node --check scripts/regression-solana-pretrade-network-fee-estimator.mjs
      - run: node --check scripts/regression-solana-pretrade-rpc-evidence-provider.mjs
      - run: node --check scripts/regression-orca-raydium-unsigned-message-evidence-builder.mjs
      - run: node --check scripts/regression-solana-unsigned-message-compiler.mjs
      - run: node --check scripts/regression-orca-whirlpool-readonly-provider.mjs
      - run: node --check scripts/regression-orca-whirlpool-rpc-quote-pool.mjs
      - run: npm install --prefix services/api --ignore-scripts --no-audit --no-fund
      - run: node scripts/regression-real-market-arbitrage-shadow.mjs
      - run: node scripts/regression-orca-raydium-arbitrage-scanner.mjs
      - run: node scripts/regression-orca-raydium-readonly-provider-adapter.mjs
      - run: node scripts/regression-orca-raydium-shadow-runtime.mjs
      - run: node scripts/regression-orca-raydium-shadow-qualification-runtime.mjs
      - run: node scripts/regression-orca-raydium-shadow-evidence-adapter.mjs
      - run: node scripts/regression-orca-raydium-shadow-risk-evidence-collector.mjs
      - run: node scripts/regression-solana-pretrade-network-fee-estimator.mjs
      - run: node scripts/regression-solana-pretrade-rpc-evidence-provider.mjs
      - run: node scripts/regression-orca-raydium-unsigned-message-evidence-builder.mjs
      - run: node scripts/regression-solana-unsigned-message-compiler.mjs
      - run: node scripts/regression-orca-whirlpool-readonly-provider.mjs
      - run: node scripts/regression-orca-whirlpool-rpc-quote-pool.mjs
      - name: Verify ORCA and Raydium SDK dependencies resolve
        working-directory: services/api
        run: node -e "Promise.all([import('@solana/kit'),import('@orca-so/whirlpools-client'),import('@orca-so/whirlpools-core'),import('@solana-program/token-2022'),import('@raydium-io/raydium-sdk-v2'),import('@solana/web3.js'),import('bn.js')]).then(()=>console.log('orca raydium sdk deps ok'))"
