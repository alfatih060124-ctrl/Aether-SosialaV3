name: Member Auto Trade State Machine Regression

on:
  pull_request:
    paths:
      - 'migrations/027_member_autotrade_state_machine.sql'
      - 'services/api/src/member-autotrade-state-machine.mjs'
      - 'services/api/src/member-autotrade-state-route.mjs'
      - 'services/api/src/member-positions-route.mjs'
      - 'deploy/Caddyfile'
      - 'api/member-autotrade-state.mjs'
      - 'public/member-authority-ui.js'
      - 'vercel.json'
      - 'deploy/vercel-direct-deploy-manifest.json'
      - 'scripts/regression-member-autotrade-state-machine.mjs'
      - '.github/workflows/member-autotrade-state-machine-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          node --check services/api/src/member-autotrade-state-machine.mjs
          node --check services/api/src/member-autotrade-state-route.mjs
          node --check services/api/src/member-positions-route.mjs
          node --check api/member-autotrade-state.mjs
          node --check public/member-authority-ui.js
          node --check scripts/regression-member-autotrade-state-machine.mjs
      - name: Run regression
        run: node scripts/regression-member-autotrade-state-machine.mjs
