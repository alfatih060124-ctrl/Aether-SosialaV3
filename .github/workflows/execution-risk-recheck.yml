name: Execution Risk Recheck Regression

on:
  pull_request:
    paths:
      - 'services/api/src/execution-risk-recheck.mjs'
      - 'scripts/execution-risk-recheck-regression.mjs'
      - '.github/workflows/execution-risk-recheck.yml'
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/execution-risk-recheck-regression.mjs
