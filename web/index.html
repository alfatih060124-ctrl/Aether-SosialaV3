<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aether Social V3</title><style>body{font-family:system-ui;margin:0;background:#0b1020;color:#eef}.wrap{max-width:1100px;margin:auto;padding:32px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:#151d33;border:1px solid #283453;border-radius:14px;padding:20px}.ok{font-weight:700}.muted{opacity:.7}button{padding:10px 14px;border:0;border-radius:8px;cursor:pointer}</style></head>
<body><main class="wrap"><h1>Aether Social V3</h1><p class="muted">Public dashboard • Shadow / Simulation by default</p><div class="grid"><section class="card"><h2>API</h2><p id="health">Checking…</p></section><section class="card"><h2>Execution</h2><p id="execution">Checking…</p></section><section class="card"><h2>Safety</h2><p class="ok">LIVE submission locked by default</p></section></div></main><script>async function load(){try{const h=await fetch('/api/health').then(r=>r.json());document.querySelector('#health').textContent=h.status+' • mode '+h.execution_mode;const e=await fetch('/api/execution/status').then(r=>r.json());document.querySelector('#execution').textContent=e.mode+' • live '+(e.live_enabled?'enabled':'disabled')}catch(e){document.querySelector('#health').textContent='API unavailable'}}load();</script></body></html>
