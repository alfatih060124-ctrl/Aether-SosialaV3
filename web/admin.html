<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aether Social V3 Admin</title><style>body{font-family:system-ui;background:#090d18;color:#eef;margin:0}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#121a2b;border:1px solid #293650;border-radius:14px;padding:18px;margin:14px 0}input,button{font:inherit;padding:10px;border-radius:9px;border:1px solid #3b4b6d;background:#0c1220;color:#eef}button{cursor:pointer}label{display:block;margin:10px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ok{color:#62d6a1}.warn{color:#ffd166}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h1>Aether Social V3 — Admin</h1><p>Control Panel • SHADOW only • LIVE remains locked</p><section class="card"><h2>Admin Authentication</h2><input id="token" type="password" placeholder="API token" style="width:100%;box-sizing:border-box"><button onclick="load()" style="margin-top:10px">Connect</button><div id="status" style="margin-top:10px"></div></section><section class="card"><h2>Platform Fees</h2><div id="current">Loading…</div><div class="grid"><label>Performance fee (bps)<input id="perf" type="number" min="0" max="10000"></label><label>Execution fee (bps)<input id="exec" type="number" min="0" max="10000"></label></div><label><input id="enabled" type="checkbox"> Fee system enabled</label><button onclick="saveFees()">Save Fee Configuration</button></section><section class="card"><h2>Risk / Audit</h2><button onclick="loadLogs()">Refresh</button><pre id="logs" style="white-space:pre-wrap;max-height:420px;overflow:auto"></pre></section></main><script>let token='';const hdr=()=>token?{'Authorization':'Bearer '+token,'Content-Type':'application/json'}:{};async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{...hdr(),...(opt.headers||{})}});const b=await r.json();if(!r.ok)throw Error(b.error||r.status);return b}async function load(){token=document.querySelector('#token').value.trim();try{const [f,e]=await Promise.all([api('/api/marketplace/fees'),api('/api/execution/status')]);document.querySelector('#perf').value=f.config.performance_fee_bps;document.querySelector('#exec').value=f.config.execution_fee_bps;document.querySelector('#enabled').checked=f.config.enabled;document.querySelector('#current').innerHTML='<span class="ok">Connected</span> • '+(e.mode||'SHADOW')+' • live='+e.live_enabled+' • fail-closed='+e.fail_closed;await loadLogs()}catch(err){document.querySelector('#status').innerHTML='<span class="warn">'+err.message+'</span>'}}async function saveFees(){try{const b=await api('/api/admin/fees',{method:'PATCH',body:JSON.stringify({performance_fee_bps:Number(perf.value),execution_fee_bps:Number(exec.value),enabled:enabled.checked})});current.innerHTML='<span class="ok">Saved</span> • '+b.config.performance_fee_bps+' bps performance • '+b.config.execution_fee_bps+' bps execution';await loadLogs()}catch(err){status.innerHTML='<span class="warn">'+err.message+'</span>'}}async function loadLogs(){try{const [r,a]=await Promise.all([api('/api/admin/risk'),api('/api/admin/audit')]);logs.textContent=JSON.stringify({risk:r.items,audit:a.items},null,2)}catch(err){logs.textContent=err.message}}load();</script></body></html>
