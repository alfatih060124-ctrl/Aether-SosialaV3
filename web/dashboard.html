<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aether Social V3 Dashboard</title><style>body{font-family:system-ui;background:#0b1020;color:#eef;margin:0}.wrap{max-width:1180px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.card{background:#151d33;border:1px solid #2b3858;border-radius:14px;padding:18px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:8px;border-bottom:1px solid #2b3858}.muted{opacity:.7}</style></head><body><main class="wrap"><h1>Aether Social V3</h1><p class="muted">Marketplace • Risk • Execution • Audit</p><div class="grid"><div class="card"><h2>Runtime</h2><div id="runtime">Loading…</div></div><div class="card"><h2>Traders</h2><div id="traders">Loading…</div></div><div class="card"><h2>Executions</h2><div id="executions">Loading…</div></div><div class="card"><h2>Safety</h2><strong>LIVE LOCKED</strong><p class="muted">Public runtime defaults to SHADOW/SIMULATION.</p></div></div><section class="card" style="margin-top:16px"><h2>Active Marketplace Traders</h2><table><thead><tr><th>Wallet</th><th>Reputation</th><th>Drawdown (bps)</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></section></main><script>const j=u=>fetch(u).then(r=>{if(!r.ok)throw Error(r.status);return r.json()});async function load(){try{const [h,t,e]=await Promise.all([j('/api/health'),j('/api/traders'),j('/api/executions')]);document.querySelector('#runtime').textContent=h.status+' • '+h.execution_mode+' • live='+h.live_enabled;document.querySelector('#traders').textContent=t.items.length+' active records';document.querySelector('#executions').textContent=e.items.length+' requests';document.querySelector('#rows').innerHTML=t.items.map(x=>`<tr><td>${x.wallet_address}</td><td>${x.reputation_score}</td><td>${x.drawdown_bps}</td><td>${x.status}</td></tr>`).join('')}catch(err){document.querySelector('#runtime').textContent='API unavailable'}}load();setInterval(load,10000)</script></body></html>
