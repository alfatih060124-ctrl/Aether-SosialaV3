services:
  - type: web
    name: aether-social-v3-api
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: EXECUTION_MODE
        value: SHADOW
      - key: LIVE_ENABLED
        value: "false"
      - key: FIXTURE_GATE_PASSED
        value: "false"
      - key: OPERATOR_APPROVED
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: API_TOKEN
        sync: false
