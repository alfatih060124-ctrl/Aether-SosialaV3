services:
  - type: web
    name: aether-social-v3-api
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node services/api/src/standby-server.mjs
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: AETHER_DEPLOYMENT_ROLE
        value: STANDBY_RENDER
      - key: EXECUTION_MODE
        value: SHADOW
      - key: LIVE_ENABLED
        value: "false"
      - key: FIXTURE_GATE_PASSED
        value: "false"
      - key: OPERATOR_APPROVED
        value: "false"
