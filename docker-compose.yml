services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aether
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aether -d aether"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  api:
    build: .
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: postgresql://aether:${POSTGRES_PASSWORD}@postgres:5432/aether
      API_TOKEN: ${API_TOKEN:?set API_TOKEN}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?set ADMIN_API_TOKEN}
      AETHER_AUTH_DOMAIN: ${AETHER_AUTH_DOMAIN:-aether.boats}
      EXECUTION_MODE: SHADOW
      LIVE_ENABLED: "false"
      FIXTURE_GATE_PASSED: "false"
      OPERATOR_APPROVED: "false"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
