services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aether
      POSTGRES_USER: aether
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aether -d aether"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true

  api:
    build: .
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8080
      AETHER_DEPLOYMENT_ROLE: PRIMARY_VM
      DATABASE_URL: postgresql://aether:${POSTGRES_PASSWORD}@postgres:5432/aether
      API_TOKEN: ${API_TOKEN:?set API_TOKEN}
      ADMIN_API_TOKEN: ${ADMIN_API_TOKEN:?set ADMIN_API_TOKEN}
      AETHER_AUTH_DOMAIN: ${AETHER_AUTH_DOMAIN:-aether.boats}
      AUTOTRADE_SHADOW_SCHEDULER_ENABLED: ${AUTOTRADE_SHADOW_SCHEDULER_ENABLED:-false}
      AUTOTRADE_SHADOW_SCHEDULER_INTERVAL_MS: ${AUTOTRADE_SHADOW_SCHEDULER_INTERVAL_MS:-15000}
      AUTOTRADE_SHADOW_BATCH_LIMIT: ${AUTOTRADE_SHADOW_BATCH_LIMIT:-20}
      AUTOTRADE_SHADOW_INITIAL_BALANCE_USDC: ${AUTOTRADE_SHADOW_INITIAL_BALANCE_USDC:-100}
      AUTOTRADE_PAPER_MIN_NET_EDGE_BPS: ${AUTOTRADE_PAPER_MIN_NET_EDGE_BPS:-0.5}
      AUTOTRADE_PAPER_POSITION_SIZE_PCT: ${AUTOTRADE_PAPER_POSITION_SIZE_PCT:-25}
      AUTOTRADE_PAPER_JUPITER_UNIVERSE_LIMIT: ${AUTOTRADE_PAPER_JUPITER_UNIVERSE_LIMIT:-20}
      # 0 = no token-count cap. Qualification is controlled by executable post-cost NET edge.
      AUTOTRADE_PAPER_CANDIDATE_LIMIT: ${AUTOTRADE_PAPER_CANDIDATE_LIMIT:-0}
      AUTOTRADE_PAPER_DEX_PAIR_ATTEMPTS: ${AUTOTRADE_PAPER_DEX_PAIR_ATTEMPTS:-12}
      # Keep the hot path below provider/RPC saturation. This limits concurrency, not transaction count.
      AETHER_HOTPATH_WORKERS: ${AETHER_HOTPATH_WORKERS:-1}
      AETHER_HOTPATH_TOKEN_BUDGET: ${AETHER_HOTPATH_TOKEN_BUDGET:-8}
      AETHER_NATIVE_TOKEN_PACING_MS: ${AETHER_NATIVE_TOKEN_PACING_MS:-120}
      AETHER_FASTPATH_PAIR_LIMIT: ${AETHER_FASTPATH_PAIR_LIMIT:-2}
      AETHER_DEXSCREENER_DISCOVERY_LIMIT: ${AETHER_DEXSCREENER_DISCOVERY_LIMIT:-8}
      AETHER_POOL_UNIVERSE_ENRICH_LIMIT: ${AETHER_POOL_UNIVERSE_ENRICH_LIMIT:-8}
      AETHER_POOL_UNIVERSE_WORKERS: ${AETHER_POOL_UNIVERSE_WORKERS:-1}
      AETHER_NATIVE_EXACT_PAIR_LIMIT: ${AETHER_NATIVE_EXACT_PAIR_LIMIT:-2}
      AETHER_NATIVE_DIRECT_PAIR_LIMIT: ${AETHER_NATIVE_DIRECT_PAIR_LIMIT:-8}
      AETHER_NATIVE_RPC_CONCURRENCY: ${AETHER_NATIVE_RPC_CONCURRENCY:-1}
      AETHER_NATIVE_WARM_CONCURRENCY: ${AETHER_NATIVE_WARM_CONCURRENCY:-1}
      SIGNAL_MIN_LIQUIDITY_USD: ${SIGNAL_MIN_LIQUIDITY_USD:-2000}
      SIGNAL_MIN_VOLUME_24H_USD: ${SIGNAL_MIN_VOLUME_24H_USD:-2000}
      SIGNAL_MAX_TOP10_HOLDER_PCT: ${SIGNAL_MAX_TOP10_HOLDER_PCT:-100}
      LIVE_MIN_SOL_RESERVE_LAMPORTS: ${LIVE_MIN_SOL_RESERVE_LAMPORTS:-}
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:?set SOLANA_RPC_URL}
      JUPITER_API_KEY: ${JUPITER_API_KEY:?set JUPITER_API_KEY}
      AETHER_SHADOW_SIMULATION_PUBLIC_KEY: ${AETHER_SHADOW_SIMULATION_PUBLIC_KEY:?set AETHER_SHADOW_SIMULATION_PUBLIC_KEY}
      AETHER_JUPITER_INTER_QUOTE_DELAY_MS: ${AETHER_JUPITER_INTER_QUOTE_DELAY_MS:-80}
      AETHER_MARKET_DISCOVERY_CACHE_DIR: /var/cache/aether-market-discovery
      EXECUTION_MODE: SHADOW
      LIVE_ENABLED: "false"
      FIXTURE_GATE_PASSED: "false"
      OPERATOR_APPROVED: "false"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - market_discovery_cache:/var/cache/aether-market-discovery
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  market_discovery_cache: